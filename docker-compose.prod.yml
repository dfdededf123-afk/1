version: "3.8"
services:
  web:
    build: .
    environment:
      NODE_ENV: production
    ports:
      - "4173:4173"
    restart: unless-stopped
  nginx:
    image: nginx:stable
    depends_on:
      - web
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
